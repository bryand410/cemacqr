name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and its development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run the tests
        run: python -m pytest

  no-dependencies:
    name: Prove there are no runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Import with site-packages removed
        # -S takes site-packages off sys.path, so the import can only succeed
        # through PYTHONPATH. If anything third-party were imported, this fails.
        run: PYTHONPATH=src python -S -c "import cemacqr; print(cemacqr.__version__)"

      - name: Assert the wheel declares no dependencies
        # This used to re-implement the check inline, and drifted: the inline
        # version counted the `dev` extra as a runtime dependency. The script is
        # the single definition, so the job calls it.
        run: |
          python -m pip install --quiet build
          python -m build
          python scripts/check_wheel.py dist

  package:
    name: Build and inspect the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Inspect the artefacts
        run: python scripts/check_wheel.py dist
